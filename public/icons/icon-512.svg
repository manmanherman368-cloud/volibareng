<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="vbAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="vbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="vbWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Volleyball stylized graphic -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Base ball circle -->
    <circle r="160" fill="#1e293b" stroke="#0f172a" stroke-width="8" />

    <!-- Section 1 (Amber / Gold curve) -->
    <path d="M 0 -160 A 160 160 0 0 1 138.5 -80 C 80 -40 40 -80 0 -160 Z" fill="url(#vbAmber)" />
    <path d="M 0 -160 C 40 -80 80 -40 138.5 -80 A 160 160 0 0 1 160 0 C 80 0 80 -80 0 -160 Z" fill="url(#vbWhite)" />

    <!-- Section 2 (Cyan / Blue curve) -->
    <path d="M 160 0 A 160 160 0 0 1 80 138.5 C 40 80 80 40 160 0 Z" fill="url(#vbBlue)" />
    <path d="M 160 0 C 80 40 40 80 80 138.5 A 160 160 0 0 1 0 160 C 0 80 80 80 160 0 Z" fill="url(#vbAmber)" />

    <!-- Section 3 (White & Blue curve) -->
    <path d="M 0 160 A 160 160 0 0 1 -138.5 80 C -80 40 -40 80 0 160 Z" fill="url(#vbWhite)" />
    <path d="M 0 160 C -40 80 -80 40 -138.5 80 A 160 160 0 0 1 -160 0 C -80 0 -80 80 0 160 Z" fill="url(#vbBlue)" />

    <!-- Section 4 (Opposite side) -->
    <path d="M -160 0 A 160 160 0 0 1 -80 -138.5 C -40 -80 -80 -40 -160 0 Z" fill="url(#vbAmber)" />
    <path d="M -160 0 C -80 -40 -40 -80 -80 -138.5 A 160 160 0 0 1 0 -160 C 0 -80 -80 -80 -160 0 Z" fill="url(#vbWhite)" />

    <!-- Ball Seams / Outlines -->
    <circle r="160" fill="none" stroke="#0f172a" stroke-width="10" />
    <path d="M -160 0 C -40 0 0 -40 0 -160" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <path d="M 0 -160 C 0 -40 40 0 160 0" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <path d="M 160 0 C 40 0 0 40 0 160" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <path d="M 0 160 C 0 40 -40 0 -160 0" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Speed motion arcs -->
  <path d="M 80 120 A 200 200 0 0 1 180 60" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 60 160 A 240 240 0 0 1 140 90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
